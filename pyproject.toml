[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmc"
version = "0.1.0"
description = "Modelo Cosmologico de Multiples Colapsos (MCMC) - motor de fondo, observables y ajuste MCMC"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Modelo-cosmologico-MCMC"}]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "emcee>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  # Version FIJADA: junto con [tool.ruff.lint] forma el contrato de
  # lint (sin fijarla, cada release de ruff puede poner el CI en rojo
  # sin que cambie una linea del repositorio).
  "ruff==0.16.7",
]

[project.scripts]
mcmc = "mcmc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# CONTRATO DE LINT EXPLICITO: el conjunto de reglas por defecto de ruff
# crece entre versiones y "pip install ruff" (ultima) hace divergir el
# CI del entorno local (el fallo del PR #13: 282 hallazgos de reglas
# I/UP/RUF/SIM aparecidos por deriva de defaults en 0.16.x, la mayoria
# en codigo preexistente). Las reglas activas se declaran aqui y la
# version de ruff queda FIJADA en las dependencias de desarrollo, la
# misma solucion documentada en el repositorio principal MCMC.
# Ampliar el conjunto (p. ej. adoptar "I") es una decision deliberada
# con su propio commit, no un efecto colateral de una version nueva.
select = ["E4", "E7", "E9", "F"]
